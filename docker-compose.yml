version: '3.8'

services:
  copilot:
    build: .
    image: copilot-cli
    volumes:
      - ~/.aws:/home/copilot-user/.aws:ro
      - .:/workspace
    stdin_open: true
    tty: true
    environment:
      - AWS_PROFILE=${AWS_PROFILE:-default}
    # The entrypoint is already set to /usr/local/bin/copilot in Dockerfile
    # Just pass arguments directly: docker-compose run --rm copilot init
